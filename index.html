<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="LibreSlides — a presentation editor that runs entirely in your browser and works offline. Make slides, present them, and open or save PowerPoint files. No account, no server." />
    <meta name="theme-color" content="#c43e1c" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="LibreSlides" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>LibreSlides</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('ls:theme');
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app" aria-busy="true">
      <div class="boot-splash" role="status">
        <svg width="56" height="56" viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="10" fill="#c43e1c"/><rect x="9" y="12" width="30" height="20" rx="2.5" fill="none" stroke="#fff" stroke-width="3.2"/><path d="M21 17.5v9l7.5-4.5z" fill="#fff"/><path d="M24 32v5M18 38h12" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/></svg>
        <span>LibreSlides</span>
      </div>
    </div>
    <noscript>LibreSlides needs JavaScript to run.</noscript>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
